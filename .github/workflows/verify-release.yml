name: Verify public release download
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag
        required: true
        type: string
      sha256:
        description: Expected ZIP SHA256
        required: true
        type: string
permissions:
  contents: read
jobs:
  download:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_SHA256: ${{ inputs.sha256 }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Anonymous download, checksum and extracted-file verification
        run: |
          $ErrorActionPreference='Stop'
          if($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+(?:-[a-z0-9.-]+)?$'){throw 'Invalid release tag'}
          if($env:RELEASE_SHA256 -notmatch '^[a-f0-9]{64}$'){throw 'Invalid expected digest'}
          $origin='https://github.com/'+$env:GITHUB_REPOSITORY+'/releases/download/'+$env:RELEASE_TAG+'/'
          $name='OfficeAgentWorkbench-'+$env:RELEASE_TAG+'-windows-x64.zip'
          $release=Invoke-RestMethod ('https://api.github.com/repos/'+$env:GITHUB_REPOSITORY+'/releases/tags/'+$env:RELEASE_TAG)
          if($release.draft -or $release.tag_name -cne $env:RELEASE_TAG){throw 'Public release identity mismatch'}
          $asset=@($release.assets | Where-Object name -eq $name)
          if($asset.Count -ne 1 -or $asset[0].digest -cne ('sha256:'+$env:RELEASE_SHA256)){throw 'Published asset digest mismatch'}
          $sumsFile=Join-Path $env:RUNNER_TEMP 'SHA256SUMS.txt'
          Invoke-WebRequest ($origin+'SHA256SUMS.txt') -OutFile $sumsFile
          $sums=Get-Content -LiteralPath $sumsFile -Raw -Encoding ascii
          $lines=@(($sums -split "`n") | Where-Object {$_ -match ('^[a-f0-9]{64}\s+'+[regex]::Escape($name)+'\s*$')})
          if($lines.Count -ne 1 -or ($lines[0] -split '\s+')[0] -cne $env:RELEASE_SHA256){throw 'Public checksum file mismatch'}
          $zip=Join-Path $env:RUNNER_TEMP $name
          Invoke-WebRequest ($origin+$name) -OutFile $zip
          if((Get-FileHash -LiteralPath $zip).Hash.ToLowerInvariant() -cne $env:RELEASE_SHA256){throw 'Downloaded bytes do not match digest'}
          $root=Join-Path $env:RUNNER_TEMP 'public-package'
          Expand-Archive -LiteralPath $zip -DestinationPath $root
          $pkg=Get-Content -LiteralPath (Join-Path $root 'package.json') -Raw | ConvertFrom-Json
          if(('v'+$pkg.version) -cne $env:RELEASE_TAG){throw 'Downloaded package version mismatch'}
          & (Join-Path $root 'runtime/node/node.exe') --import tsx (Join-Path $root 'scripts/Manage-Package.ts') verify $root
          if($LASTEXITCODE -ne 0){throw 'Extracted file integrity mismatch'}
          "Anonymous public download and extracted-file verification passed: $env:RELEASE_TAG" >> $env:GITHUB_STEP_SUMMARY
